name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync
      - run: uv run ruff check .
      # Only test_model_provider.py runs here — every other script under
      # workshop/ needs a live local Ollama model or AWS Bedrock access,
      # neither available on GitHub-hosted runners.
      - run: uv run python -m pytest workshop/test_model_provider.py -v
